AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DalTime Scheduling Application Backend

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:4200,https://localhost'
    Description: 'Comma-separated frontend origins for CORS (https://localhost is the Capacitor mobile WebView origin)'
  CognitoUserPoolId:
    Type: String
    Default: 'us-east-1_LVp3uUQ5l'
  CognitoClientId:
    Type: String
    Default: '1vvrr1dvepebrkl1v246pbijju'
  LambdaArchitecture:
    Type: String
    Default: arm64
    AllowedValues:
      - arm64
      - x86_64
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: 'CloudWatch log retention in days (dev 14, qa 14, prod 90)'
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: 'Lambda ApplicationLogLevel and POWERTOOLS_LOG_LEVEL (dev DEBUG, qa/prod INFO)'
  AppEnvironment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: 'Deployment environment name surfaced as ENVIRONMENT in Lambda env vars'
  AlertEmail:
    Type: String
    Default: ''
    Description: 'Email address for the ERROR-rate CloudWatch alarm (SNS subscription). Empty disables the subscription only — the SNS topic and alarm deploy either way, so a missing value never breaks a deploy.'

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs24.x
    Architectures:
      - !Ref LambdaArchitecture
    Environment:
      Variables:
        NODE_ENV: development
        ALLOWED_ORIGINS: !Join [',', !Ref AllowedOrigins]
        TABLE_NAME: !Ref DalTimeTable
        POWERTOOLS_SERVICE_NAME: daltime-backend
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        ENVIRONMENT: !Ref AppEnvironment

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # Access log group for the HTTP API (API Gateway V2).
  # API Gateway V2 does not use the account-level CloudWatch role (that's V1 only).
  # Instead, we grant the delivery.logs service principal write access via a
  # resource-based policy directly on the log group.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}/access-logs'
      RetentionInDays: !Ref LogRetentionDays

  ApiAccessLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-apigw-access-log-policy'
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowApiGatewayV2Logging",
              "Effect": "Allow",
              "Principal": {
                "Service": "delivery.logs.amazonaws.com"
              },
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": "${ApiAccessLogGroup.Arn}:*",
              "Condition": {
                "StringEquals": {
                  "aws:SourceAccount": "${AWS::AccountId}"
                }
              }
            }
          ]
        }

  OrgAdminsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-OrgAdminsFunction'
      RetentionInDays: !Ref LogRetentionDays

  EmployeesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-EmployeesFunction'
      RetentionInDays: !Ref LogRetentionDays

  ProfileFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ProfileFunction'
      RetentionInDays: !Ref LogRetentionDays

  ManagersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
