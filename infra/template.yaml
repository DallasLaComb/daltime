      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: DalTime/Logging
          MetricName: ErrorCount
          DefaultValue: 0

  NotificationsFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NotificationsFunctionLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: DalTime/Logging
          MetricName: ErrorCount
          DefaultValue: 0

  EmployeeAvailableShiftsFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref EmployeeAvailableShiftsFunctionLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: DalTime/Logging
          MetricName: ErrorCount
          DefaultValue: 0

  EmployeeSwapShiftsFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref EmployeeSwapShiftsFunctionLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: DalTime/Logging
          MetricName: ErrorCount
          DefaultValue: 0

  HealthFunctionErrorMetricFilter:
