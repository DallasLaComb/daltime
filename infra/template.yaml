AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DalTime Scheduling Application Backend

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'http://localhost:4200,https://localhost,capacitor://localhost'
    Description: 'Comma-separated frontend origins for CORS (https://localhost = Capacitor Android WebView, capacitor://localhost = Capacitor iOS WebView)'
  CognitoUserPoolId:
    Type: String
    Default: 'us-east-1_LVp3uUQ5l'
  CognitoClientId:
    Type: String
    Default: '1vvrr1dvepebrkl1v246pbijju'
  LambdaArchitecture:
    Type: String
    Default: arm64
    AllowedValues:
      - arm64
      - x86_64

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs24.x
    Architectures:
      - !Ref LambdaArchitecture
    Environment:
      Variables:
        NODE_ENV: development
        ALLOWED_ORIGINS: !Join [',', !Ref AllowedOrigins]
        TABLE_NAME: !Ref DalTimeTable

Resources:
  # Access log group for the HTTP API (API Gateway V2).
  # API Gateway V2 does not use the account-level CloudWatch role (that's V1 only).
  # Instead, we grant the delivery.logs service principal write access via a
  # resource-based policy directly on the log group.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}/access-logs'
      RetentionInDays: 1

  ApiAccessLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-apigw-access-log-policy'
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowApiGatewayV2Logging",
              "Effect": "Allow",
              "Principal": {
                "Service": "delivery.logs.amazonaws.com"
              },
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": "${ApiAccessLogGroup.Arn}:*",
              "Condition": {
                "StringEquals": {
                  "aws:SourceAccount": "${AWS::AccountId}"
                }
              }
            }
          ]
        }

  OrgAdminsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-OrgAdminsFunction'
      RetentionInDays: 1

  EmployeesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-EmployeesFunction'
      RetentionInDays: 1

  ProfileFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ProfileFunction'
      RetentionInDays: 1

  ManagersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ManagersFunction'
      RetentionInDays: 1

  ManagerProfileFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ManagerProfileFunction'
      RetentionInDays: 1

  ManagerProfileFunction:
    Type: AWS::Serverless::Function
    DependsOn: ManagerProfileFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ManagerProfileFunction'
      LoggingConfig:
        LogGroup: !Sub '/aws/lambda/${AWS::StackName}-ManagerProfileFunction'
      CodeUri: ../backend
      Handler: src/functions/manager/profile/handler.handler
      Events:
        GetManagerProfile:
          Type: HttpApi
          Properties:
            Path: /manager/profile
            Method: GET
            ApiId: !Ref DalTimeHttpApi
        UpdateManagerProfile:
          Type: HttpApi
          Properties:
            Path: /manager/profile
            Method: PUT
            ApiId: !Ref DalTimeHttpApi
        OptionsManagerProfile:
          Type: HttpApi
          Properties:
            Path: /manager/profile
            Method: OPTIONS
            ApiId: !Ref DalTimeHttpApi
            Auth:
              Authorizer: NONE
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DalTimeTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/manager/profile/handler.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: 'es2022'
        Sourcemap: true
        External:
          - '@aws-sdk/*'

