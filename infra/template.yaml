  # --- Phase 10: observability payoff ---
  # One metric filter per function log group, all emitting to the same un-dimensioned metric so a
  # single alarm's Sum statistic aggregates ERROR-level lines across every function.
  OrgAdminsFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref OrgAdminsFunctionLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: DalTime/Logging
          MetricName: ErrorCount
          DefaultValue: 0

