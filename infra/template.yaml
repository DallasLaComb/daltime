          DefaultValue: 0

  ClientLogsFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ClientLogsFunctionLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: DalTime/Logging
          MetricName: ErrorCount
          DefaultValue: 0

  ErrorAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-error-alarm'

  ErrorAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref ErrorAlarmTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-error-rate'
      AlarmDescription: 'Fires when the backend logs an ERROR-level line (Sum across all Lambda functions, 5-minute window).'
      Namespace: DalTime/Logging
      MetricName: ErrorCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ErrorAlarmTopic

  # Saved Logs Insights queries -- docs/logging.md section 7 (7.1-7.7; 7.8 is an ops procedure, not a
  # query). ClickTrail/RageClicks were designed around a custom interaction-tracker that Phase 8b
  # (decision D13) replaced with PostHog -- kept as valid saved queries, but expect little/no data
  # until/unless the app starts emitting 'click'/'rage_click' client-log entries again.
  ErrorsByRouteQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: DalTime/Errors by route (last 24h)
      QueryString: |
        filter level = "ERROR"
        | stats count(*) as errors by route, handler
        | sort errors desc

  SlowRequestsQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: DalTime/Slow requests (over 500ms)
      QueryString: |
        filter message = "request completed" and duration_ms > 500
        | stats avg(duration_ms) as avg_ms, max(duration_ms) as max_ms, count(*) as count by route
        | sort max_ms desc

  CallerActivityQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: DalTime/Activity for one caller (sub)
      QueryString: |
        filter caller_sub = "<paste sub here>"
        | fields timestamp, level, message, route, status, duration_ms
        | sort timestamp asc

  ClientErrorsQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: DalTime/Client errors (frontend)
      QueryString: |
        filter source = "client" and level in ["ERROR", "WARN"]
        | fields timestamp, event_type, message, device_type, os, platform, breakpoint
        | sort timestamp desc
        | limit 200

  ClickTrailQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: DalTime/Click trail for a session
      QueryString: |
        filter source = "client" and client_session_id = "<paste id here>"
        | fields timestamp, event_type, target, route, message
        | sort timestamp asc

  ErrorsByDeviceQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: DalTime/Errors by device type and OS
      QueryString: |
        filter level = "ERROR"
        | stats count(*) as errors by device_type, os, platform
        | sort errors desc

  RageClicksQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: DalTime/Rage clicks by target
      QueryString: |
        filter source = "client" and event_type = "rage_click"
        | stats count(*) as rage_clicks by target
        | sort rage_clicks desc
        | limit 50


Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${DalTimeHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  OrganizationsEndpoint:
    Value: !Sub 'https://${DalTimeHttpApi}.execute-api.${AWS::Region}.amazonaws.com/organizations'
  OrganizationsFunction:
    Value: !GetAtt OrganizationsFunction.Arn
  DalTimeTable:
    Value: !Ref DalTimeTable
