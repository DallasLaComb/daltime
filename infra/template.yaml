      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ManagersFunction'
      RetentionInDays: !Ref LogRetentionDays

  ManagerProfileFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ManagerProfileFunction'
      RetentionInDays: !Ref LogRetentionDays

  ManagerProfileFunction:
    Type: AWS::Serverless::Function
    DependsOn: ManagerProfileFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ManagerProfileFunction'
      LoggingConfig:
        LogGroup: !Sub '/aws/lambda/${AWS::StackName}-ManagerProfileFunction'
        LogFormat: JSON
        ApplicationLogLevel: !Ref LogLevel
        SystemLogLevel: WARN
      CodeUri: ../backend
      Handler: src/functions/manager/profile/handler.handler
      Events:
        GetManagerProfile:
          Type: HttpApi
          Properties:
            Path: /manager/profile
            Method: GET
            ApiId: !Ref DalTimeHttpApi
        UpdateManagerProfile:
          Type: HttpApi
          Properties:
            Path: /manager/profile
            Method: PUT
            ApiId: !Ref DalTimeHttpApi
        OptionsManagerProfile:
          Type: HttpApi
          Properties:
            Path: /manager/profile
            Method: OPTIONS
            ApiId: !Ref DalTimeHttpApi
            Auth:
              Authorizer: NONE
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DalTimeTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/manager/profile/handler.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: 'es2022'
        Sourcemap: true
        External:
          - '@aws-sdk/*'

