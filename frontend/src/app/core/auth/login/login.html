<div class="min-h-screen flex items-center justify-center py-12 px-4 bg-dt-neutral-50">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <img src="daltime-logo.png" alt="DalTime" class="h-16 w-auto mx-auto" />
      <h2 class="mt-4 text-2xl font-bold text-gray-900">Sign In</h2>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200">
      <div class="p-6">
        @if (error()) {
          <div
            class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-800"
            data-testid="login-error"
          >
            {{ error() }}
          </div>
        }

        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base shadow-sm focus:border-dt-secondary focus:outline-none focus:ring-1 focus:ring-dt-secondary"
            [class.input-error]="submitted() && !email().trim()"
            id="email"
            data-testid="email-input"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            placeholder="you@example.com"
            autocomplete="email"
          />
          @if (submitted() && !email().trim()) {
            <p class="input-feedback" data-testid="email-error">Email is required</p>
          }
        </div>

        <app-password-input
          class="mb-6"
          inputId="password"
          label="Password"
          testId="password-input"
          placeholder="Password"
          autocomplete="current-password"
          [value]="password()"
          [hasError]="submitted() && !password().trim()"
          errorMessage="Password is required"
          errorTestId="password-error"
          (valueChange)="password.set($event)"
          (enterPressed)="onSubmit()"
        />

        @if (offerSaveBiometric()) {
          <div class="mb-4 flex items-center gap-2">
            <input
              id="save-biometric"
              type="checkbox"
              class="h-5 w-5 rounded border-gray-300 text-dt-primary focus:ring-dt-secondary"
              data-testid="save-biometric-checkbox"
              [checked]="saveBiometricLogin()"
              (change)="saveBiometricLogin.set($any($event.target).checked)"
            />
            <label for="save-biometric" class="text-sm text-gray-700"
              >Use {{ biometricLabel() }} to sign in next time</label
            >
          </div>
        }

        <app-button
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="submitting()"
          testId="sign-in-btn"
          (clicked)="onSubmit()"
          >Sign In</app-button
        >

        @if (showBiometric()) {
          <app-button
            class="mt-3 block"
            variant="primary-outline"
            size="lg"
            [fullWidth]="true"
            [loading]="biometricBusy()"
            testId="biometric-sign-in-btn"
            (clicked)="onBiometricSignIn()"
            >Sign in with {{ biometricLabel() }}</app-button
          >
        }

        <div class="text-center mt-4">
          <a
            routerLink="/forgot-password"
            class="text-sm text-gray-500 hover:text-dt-primary transition-colors"
            data-testid="forgot-password-link"
            >Forgot password?</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
