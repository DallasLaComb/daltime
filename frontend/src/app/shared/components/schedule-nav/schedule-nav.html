<div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
  <div class="flex w-full items-center gap-2 sm:w-auto">
    <button
      type="button"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg sm:h-8 sm:w-8 border border-gray-300 bg-white text-gray-600 shadow-sm transition-colors hover:bg-gray-50 hover:text-gray-900"
      data-testid="prev-period"
      aria-label="Previous period"
      (click)="prevRequested.emit()"
      (keydown.enter)="prevRequested.emit()"
      (keydown.space)="prevRequested.emit()"
    >
      &#8249;
    </button>
    <span
      class="min-w-0 flex-1 truncate text-center text-sm font-semibold text-gray-800 sm:min-w-[180px] sm:flex-none sm:text-base"
      >{{ viewLabel() }}</span
    >
    <button
      type="button"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg sm:h-8 sm:w-8 border border-gray-300 bg-white text-gray-600 shadow-sm transition-colors hover:bg-gray-50 hover:text-gray-900"
      data-testid="next-period"
      aria-label="Next period"
      (click)="nextRequested.emit()"
      (keydown.enter)="nextRequested.emit()"
      (keydown.space)="nextRequested.emit()"
    >
      &#8250;
    </button>
    <button
      type="button"
      class="min-h-11 shrink-0 rounded-lg border border-gray-300 bg-white px-3 py-1 text-sm font-medium sm:min-h-0 text-gray-600 shadow-sm transition-colors hover:bg-gray-50"
      data-testid="goto-today"
      (click)="todayRequested.emit()"
      (keydown.enter)="todayRequested.emit()"
      (keydown.space)="todayRequested.emit()"
    >
      Today
    </button>
  </div>
  <div class="flex items-center gap-3 text-xs font-medium text-gray-600">
    <span class="flex items-center gap-1.5"
      ><span class="inline-block h-2.5 w-2.5 rounded-full bg-sky-400"></span>Morning</span
    >
    <span class="flex items-center gap-1.5"
      ><span class="inline-block h-2.5 w-2.5 rounded-full bg-amber-400"></span>Afternoon</span
    >
    <span class="flex items-center gap-1.5"
      ><span class="inline-block h-2.5 w-2.5 rounded-full bg-violet-400"></span>Night</span
    >
  </div>
</div>
