<div class="flex flex-col gap-4" data-testid="mobile-day-list">
  @for (day of days(); track day.dateKey) {
    <section [attr.aria-label]="day.label" data-testid="mobile-day-section">
      <!-- Sticks below the app navbar (h-16 + status-bar inset) while its day is on screen. -->
      <div
        [class]="
          'sticky top-[calc(4rem+env(safe-area-inset-top))] z-10 mb-2 flex items-center justify-between rounded-lg px-3 py-2 ' +
          (day.isToday ? 'bg-dt-primary text-white' : 'bg-gray-100 text-gray-700')
        "
        [attr.aria-current]="day.isToday ? 'date' : null"
        data-testid="mobile-day-header"
      >
        <h3 class="m-0 text-sm font-semibold">{{ day.label }}</h3>
        <span class="text-xs font-medium opacity-80"
          >{{ day.count }} {{ day.count === 1 ? 'shift' : 'shifts' }}</span
        >
      </div>
      <ng-container [ngTemplateOutlet]="body()" [ngTemplateOutletContext]="{ $implicit: day }" />
    </section>
  }
</div>
