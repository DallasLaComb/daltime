@if (open()) {
  <div class="fixed inset-0 bg-black/50 z-40"></div>
  <div
    class="fixed inset-0 z-50 flex items-end pt-safe-top pb-safe-bottom sm:items-center justify-center sm:p-4"
    tabindex="-1"
    data-testid="confirmation-modal"
    (click)="cancelled.emit()"
    (keydown)="onKeydown($event)"
    #modalContainer
  >
    <div
      class="w-full sm:max-w-lg"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <div
        class="dt-debug bg-white shadow-xl sm:rounded-xl max-h-safe-dvh sm:max-h-[90vh] overflow-y-auto"
      >
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
          <h5 class="text-lg font-semibold text-gray-900">{{ title() }}</h5>
          <button
            type="button"
            class="text-gray-400 hover:text-gray-600 transition-colors text-2xl leading-none -m-2.5 min-w-11 p-2.5"
            data-testid="confirmation-modal-close"
            (click)="cancelled.emit()"
          >
            &times;
          </button>
        </div>
        <div class="px-6 py-4">
          <ng-content></ng-content>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 px-6 py-4 border-t border-gray-200">
          <app-button
            variant="secondary"
            [fullWidth]="true"
            testId="confirmation-modal-cancel"
            (clicked)="cancelled.emit()"
          >
            Cancel
          </app-button>
          <app-button
            [variant]="confirmVariant()"
            [fullWidth]="true"
            [loading]="saving()"
            testId="confirmation-modal-confirm"
            (clicked)="confirmed.emit()"
          >
            {{ confirmLabel() }}
          </app-button>
        </div>
      </div>
    </div>
  </div>
}
