@if (open()) {
  <div class="fixed inset-0 z-40 bg-black/50"></div>
  <div
    class="fixed inset-0 z-50 flex items-end pt-safe-top pb-safe-bottom justify-center sm:items-center sm:p-4"
    tabindex="-1"
    data-testid="delete-modal"
    (click)="cancelled.emit()"
    (keydown)="onKeydown($event)"
    #modalContainer
  >
    <div
      class="w-full sm:max-w-lg"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <div
        class="dt-debug max-h-safe-dvh overflow-y-auto bg-white shadow-xl sm:max-h-[90vh] sm:rounded-xl"
      >
        <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4">
          <h5 class="text-lg font-semibold text-gray-900">Delete {{ entityType() }}</h5>
          <button
            type="button"
            class="text-2xl leading-none -m-2.5 min-w-11 p-2.5 text-gray-400 transition-colors hover:text-gray-600"
            data-testid="delete-modal-close"
            (click)="cancelled.emit()"
          >
            &times;
          </button>
        </div>
        <div class="px-6 py-4">
          <p class="text-neutral-700">
            Are you sure you want to delete
            <strong data-testid="delete-modal-entity-name">{{ entityName() }}</strong
            >? This action cannot be undone.
          </p>
        </div>
        <div class="flex flex-col gap-3 border-t border-gray-200 px-6 py-4 sm:flex-row">
          <app-button
            variant="secondary"
            [fullWidth]="true"
            testId="delete-modal-cancel"
            (clicked)="cancelled.emit()"
          >
            Cancel
          </app-button>
          <app-button
            variant="danger"
            [fullWidth]="true"
            [loading]="saving()"
            testId="delete-modal-confirm"
            (clicked)="confirmed.emit()"
          >
            Delete
          </app-button>
        </div>
      </div>
    </div>
  </div>
}
