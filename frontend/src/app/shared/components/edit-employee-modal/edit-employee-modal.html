<div class="dt-debug">
  @if (open()) {
    <div class="fixed inset-0 bg-black/50 z-40"></div>
    <div
      class="fixed inset-0 z-50 flex items-end pt-safe-top pb-safe-bottom sm:items-center justify-center sm:p-4"
      tabindex="-1"
      data-testid="edit-modal"
      (click)="cancel()"
      (keydown.escape)="cancel()"
    >
      <div
        role="dialog"
        aria-modal="true"
        class="w-full sm:max-w-lg"
        tabindex="-1"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
      >
        <div
          class="bg-white shadow-xl sm:rounded-xl max-h-safe-dvh sm:max-h-[90vh] overflow-y-auto"
        >
          <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
            <h5 class="text-lg font-semibold text-gray-900">Edit {{ entityLabel() }}</h5>
            <button
              type="button"
              class="text-gray-400 hover:text-gray-600 transition-colors text-2xl leading-none -m-2.5 min-w-11 p-2.5"
              data-testid="close-edit-modal-btn"
              (click)="cancel()"
            >
              &times;
            </button>
          </div>
          <div class="px-6 py-4 space-y-4">
            @if (error()) {
              <div
                class="rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-800"
                data-testid="edit-modal-error"
              >
                {{ error() }}
              </div>
            }
            <div>
              <p class="block text-sm font-medium text-gray-700 mb-1">Email</p>
              <input
                type="email"
                class="block w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-base text-gray-500"
                aria-label="Email"
                data-testid="edit-email-display"
                [value]="initial()?.email"
                readonly
                disabled
              />
            </div>
            <div>
              <label for="editEmpFirstName" class="block text-sm font-medium text-gray-700 mb-1"
                >First Name</label
              >
              <input
                type="text"
                class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base shadow-sm focus:border-dt-secondary focus:outline-none focus:ring-1 focus:ring-dt-secondary"
                [class.input-error]="editSubmitted() && !editFirstName().trim()"
                id="editEmpFirstName"
                data-testid="edit-first-name-input"
                [value]="editFirstName()"
                (input)="editFirstName.set($any($event.target).value)"
                autocomplete="given-name"
              />
              @if (editSubmitted() && !editFirstName().trim()) {
                <p class="input-feedback" data-testid="edit-first-name-error">
                  First name is required
                </p>
              }
            </div>
            <div>
              <label for="editEmpLastName" class="block text-sm font-medium text-gray-700 mb-1"
                >Last Name</label
              >
              <input
                type="text"
                class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base shadow-sm focus:border-dt-secondary focus:outline-none focus:ring-1 focus:ring-dt-secondary"
                [class.input-error]="editSubmitted() && !editLastName().trim()"
                id="editEmpLastName"
                data-testid="edit-last-name-input"
                [value]="editLastName()"
                (input)="editLastName.set($any($event.target).value)"
                autocomplete="family-name"
              />
              @if (editSubmitted() && !editLastName().trim()) {
                <p class="input-feedback" data-testid="edit-last-name-error">
                  Last name is required
                </p>
              }
            </div>
            <div>
              <label for="editEmpPhone" class="block text-sm font-medium text-gray-700 mb-1"
                >Phone <span class="text-gray-400">(optional)</span></label
              >
              <input
                type="tel"
                class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base shadow-sm focus:border-dt-secondary focus:outline-none focus:ring-1 focus:ring-dt-secondary"
                id="editEmpPhone"
                data-testid="edit-phone-input"
                [value]="editPhone()"
                (input)="editPhone.set($any($event.target).value)"
                autocomplete="tel"
              />
            </div>
            @if (managers().length > 0) {
              <div>
                <label for="editEmpManager" class="block text-sm font-medium text-gray-700 mb-1"
                  >Manager <span class="text-gray-400">(optional)</span></label
                >
                <select
                  class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base shadow-sm focus:border-dt-secondary focus:outline-none focus:ring-1 focus:ring-dt-secondary"
                  id="editEmpManager"
                  data-testid="edit-manager-select"
                  [value]="editManagerId()"
                  (change)="editManagerId.set($any($event.target).value)"
                >
                  <option value="">No manager</option>
                  @for (manager of managers(); track manager.manager_id) {
                    <option [value]="manager.manager_id">
                      {{ manager.first_name }} {{ manager.last_name }}
                    </option>
                  }
                </select>
              </div>
            }
          </div>
          <div class="flex flex-col sm:flex-row gap-3 px-6 py-4 border-t border-gray-200">
            <app-button
              variant="secondary"
              [fullWidth]="true"
              testId="cancel-edit-btn"
              (clicked)="cancel()"
              >Cancel</app-button
            >
            <app-button
              variant="primary"
              [fullWidth]="true"
              [loading]="saving()"
              testId="save-edit-btn"
              (clicked)="save()"
              >Save</app-button
            >
          </div>
        </div>
      </div>
    </div>
  }
</div>
